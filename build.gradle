// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    ext {
        kotlinVersion = '1.7.10'
        daggerHiltVersion = '2.43.2'
        appcompatVersion = '1.5.1'
        materialVersion = '1.7.0-alpha02'
        lifecycleVersion = '2.5.1'
        coreKtxVersion = '1.9.0'
        fragmentKtxVersion = '1.5.2'
        constraintLayoutVersion = '2.1.4'
        recyclerViewVersion = '1.2.1'
        cardViewVersion = '1.0.0'
        coroutinesVersion = '1.6.4'
        retrofitVersion = '2.9.0'
        okHttpVersion = '4.10.0'
        gsonVersion = '2.9.1'

        // UI:
        lottieVersion = '5.2.0'
        adapterDelegatesVersion = '4.3.2'
        glideVersion = '4.13.2'
        // coilVersion = '2.0.1'
        coilVersion = '2.2.2'

        // Navigation:
        navigationVersion = '2.5.2'

        // Jetpack Compose:
        composeCompilerVersion = '1.3.0'
        activityComposeVersion = '1.5.1'
        composeVersion = '1.2.1'
        viewModelComposeVersion = '2.5.1'
        hiltNavigationCompose = '1.0.0'

        // Testing:
        junitVersion = '4.13.2'
        espressoVersion = '3.4.0'
    }

    dependencies {
        classpath "com.google.dagger:hilt-android-gradle-plugin:$daggerHiltVersion"
        classpath "androidx.navigation:navigation-safe-args-gradle-plugin:$navigationVersion"
    }
}

plugins {
    id 'com.android.application' version '7.3.1' apply false
    id 'com.android.library' version '7.3.1' apply false
    id 'org.jetbrains.kotlin.android' version '1.7.10' apply false
}

task clean(type: Delete) {
    delete rootProject.buildDir
}