// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    ext {
        // Dependency injection (DI):
        daggerHiltVersion = '2.44'

        // OKHttp:
        retrofitVersion = '2.9.0'
        okHttpVersion = '4.10.0'

        // UI:
        coilVersion = '2.2.2'
        adapterDelegatesVersion = '4.3.2'

        // Navigation:
        hiltNavigationCompose = '1.0.0'
        navigationVersion = '2.5.3'

        // Jetpack Compose:
        composeCompilerVersion = '1.3.2'
        composeVersion = '1.3.0'

        // Testing:
        junitVersion = '4.13.2'
        espressoVersion = '3.4.0'
    }

    dependencies {
        classpath libs.com.google.dagger.hilt.android.gradle.plugin // "com.google.dagger:hilt-android-gradle-plugin:$daggerHiltVersion"
        classpath libs.androidx.navigation.safe.args.gradle.plugin // "androidx.navigation:navigation-safe-args-gradle-plugin:$navigationVersion"
    }
}

plugins {
    alias libs.plugins.com.android.application apply false
    alias libs.plugins.com.android.library apply false
    alias libs.plugins.org.jetbrains.kotlin.android apply false
    alias libs.plugins.com.github.ben.manes.versions
    alias libs.plugins.nl.littlerobots.version.catalog.update
}

versionCatalogUpdate {
    sortByKey = false
}

task clean(type: Delete) {
    delete rootProject.buildDir
}