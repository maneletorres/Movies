[versions]
android = "8.5.2"
androidxComposeBom = "2024.06.00"
daggerHilt = "2.52"
firebaseBom = "33.1.2"
firebaseCrashlytics = "3.0.2"
googleServices = "4.4.2"
hilt = "1.2.0"
kotlin = "2.0.10"
ksp = "2.0.10-1.0.24"
ktfmt = "0.19.0"
retrofit2Bom = "2.11.0" # since 2.10.0 contains an error
room = "2.6.1"
okhttp3Bom = "4.12.0"
timber = "5.0.1"

gradle-versions-version = "0.51.0"
version-catalog-update-version = "0.8.4"
coil-kt-version = "2.7.0"
adapter-delegates4-version = "4.3.2"
navigation-ui-ktx-version = "2.7.7"
mockk = "1.13.12"
composeMaterial = "1.6.8"
compose-ui-version = "1.6.8"
junit-version = "4.13.2"

[libraries]
# androidx-compose-material = { module = "androidx.compose.material:material", version.ref = "composeMaterial" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "androidxComposeBom" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }

androidx-hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "hilt" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-navigation-testing = { module = "androidx.navigation:navigation-testing", version.ref = "navigation-ui-ktx-version" }
androidx-navigation-ui-ktx = { module = "androidx.navigation:navigation-ui-ktx", version.ref = "navigation-ui-ktx-version" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
com-hannesdorfmann-adapterdelegates4 = { module = "com.hannesdorfmann:adapterdelegates4", version.ref = "adapter-delegates4-version" }
com-jakewharton-timber = { module = "com.jakewharton.timber:timber", version.ref = "timber" }

com-squareup-retrofit2-bom = { group = "com.squareup.retrofit2", name = "retrofit-bom", version.ref = "retrofit2Bom" }
com-squareup-retrofit2-retrofit = { group = "com.squareup.retrofit2", name = "retrofit" }
com-squareup-retrofit2-converter-moshi = { group = "com.squareup.retrofit2", name = "converter-moshi" }

com-squareup-okhttp3-bom = { group = "com.squareup.okhttp3", name = "okhttp-bom", version.ref = "okhttp3Bom" }
com-squareup-okhttp3-okhttp = { group = "com.squareup.okhttp3", name = "okhttp" }
com-squareup-okhttp3-okhttp-urlconnection = { group = "com.squareup.okhttp3", name = "okhttp-urlconnection" }
com-squareup-okhttp3-logging-interceptor = { group = "com.squareup.okhttp3", name = "logging-interceptor" }

dagger-hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "daggerHilt" }
dagger-hilt-android-compiler = { module = "com.google.dagger:hilt-android-compiler", version.ref = "daggerHilt" }

firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom" }
firebase-analytics = { group = "com.google.firebase", name = "firebase-analytics-ktx" }
firebase-crashlytics = { group = "com.google.firebase", name = "firebase-crashlytics-ktx" }
firebase-auth = { group = "com.google.firebase", name = "firebase-auth-ktx" }
io-coil-kt-coil-compose = { module = "io.coil-kt:coil-compose", version.ref = "coil-kt-version" }
junit = { module = "junit:junit", version.ref = "junit-version" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }

[bundles]
firebase = [
    "firebase-analytics",
    "firebase-auth",
    "firebase-crashlytics",
]
retrofit2 = [
    "com-squareup-retrofit2-converter-moshi",
    "com-squareup-retrofit2-retrofit",
]
okhttp3 = [
    "com-squareup-okhttp3-logging-interceptor",
    "com-squareup-okhttp3-okhttp",
    "com-squareup-okhttp3-okhttp-urlconnection",
]
ui = [
    "com-hannesdorfmann-adapterdelegates4",
    "io-coil-kt-coil-compose",
]
navigation = [
    "androidx-hilt-navigation-compose",
    "androidx-navigation-ui-ktx",
]
compose = [
    "androidx-compose-material3",
    "androidx-compose-ui-tooling",
]
room = [
    "androidx-room-ktx",
    "androidx-room-runtime",
]
testing = [
    "junit",
    "mockk",
]
testing-compose = [
    "androidx-compose-ui-test-junit4",
    "androidx-navigation-testing",
]

[plugins]
android-application = { id = "com.android.application", version.ref = "android" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
jetbrains-kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
firebase-crashlytics = { id = "com.google.firebase.crashlytics", version.ref = "firebaseCrashlytics" }
dagger-hilt = { id = "com.google.dagger.hilt.android", version.ref = "daggerHilt" }
gradle-versions = { id = "com.github.ben-manes.versions", version.ref = "gradle-versions-version" }
version-catalog-update = { id = "nl.littlerobots.version-catalog-update", version.ref = "version-catalog-update-version" }
ktfmt = { id = "com.ncorti.ktfmt.gradle", version.ref = "ktfmt" }
