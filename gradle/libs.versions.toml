[versions]
# Plugin versions:
android-version = "8.5.2"
kotlin-version = "2.0.10"
ksp-version = "2.0.10-1.0.24"
google-services-version = "4.4.2"
firebase-crashlytics-version = "3.0.2"
dagger-hilt-version = "2.52"
gradle-versions-version = "0.51.0"
version-catalog-update-version = "0.8.4"
ktfmt-version = "0.19.0"
# Library versions:
firebase-bom-version = "33.1.2"
timber-version = "5.0.1"
retrofit2-version = "2.9.0" # since 2.10.0 contains an error
okhttp3-version = "4.12.0"
coil-kt-version = "2.7.0"
adapter-delegates4-version = "4.3.2"
navigation-ui-ktx-version = "2.7.7"
mockk-version = "1.13.12"
hilt-version = "1.2.0"
compose-material-version = "1.6.8"
compose-ui-version = "1.6.8"
room-version = "2.6.1"
# Testing library versions:
junit-version = "4.13.2"

[libraries]
# Dependency injection (DI) libraries:
dagger-hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "dagger-hilt-version" }
dagger-hilt-android-compiler = { module = "com.google.dagger:hilt-android-compiler", version.ref = "dagger-hilt-version" }

# Firebase libraries:
firebase-bom = { group = "com.google.firebase", name = "firebase-bom",version.ref = "firebase-bom-version" }
firebase-analytics = { group = "com.google.firebase", name = "firebase-analytics-ktx" }
firebase-crashlytics = { group = "com.google.firebase", name = "firebase-crashlytics-ktx" }
firebase-auth = { group = "com.google.firebase", name = "firebase-auth-ktx" }

# Timber libraries:
com-jakewharton-timber = { module = "com.jakewharton.timber:timber", version.ref = "timber-version" }

# Retrofit libraries:
com-squareup-retrofit2-retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit2-version" }
com-squareup-retrofit2-converter-moshi = { module = "com.squareup.retrofit2:converter-moshi", version.ref = "retrofit2-version" }

# OkHttp libraries:
com-squareup-okhttp3-okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp3-version" }
com-squareup-okhttp3-okhttp-urlconnection = { module = "com.squareup.okhttp3:okhttp-urlconnection", version.ref = "okhttp3-version" }
com-squareup-okhttp3-logging-interceptor = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp3-version" }

# UI libraries:
io-coil-kt-coil-compose = { module = "io.coil-kt:coil-compose", version.ref = "coil-kt-version" }
com-hannesdorfmann-adapterdelegates4 = { module = "com.hannesdorfmann:adapterdelegates4", version.ref = "adapter-delegates4-version" }

# Navigation libraries:
androidx-hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "hilt-version" }
androidx-navigation-ui-ktx = { module = "androidx.navigation:navigation-ui-ktx", version.ref = "navigation-ui-ktx-version" }

# Jetpack Compose libraries:
androidx-compose-material = { module = "androidx.compose.material:material", version.ref = "compose-material-version" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling", version.ref = "compose-ui-version" }

# Room:
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room-version" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room-version" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room-version" }

# Testing libraries:
junit = { module = "junit:junit", version.ref = "junit-version" }
androidx-navigation-testing = { module = "androidx.navigation:navigation-testing", version.ref = "navigation-ui-ktx-version" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk-version" }

# Compose testing libraries:
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4", version.ref = "compose-ui-version" }

[bundles]
firebase = [
    "firebase-analytics",
    "firebase-auth",
    "firebase-crashlytics",
]
retrofit2 = [
    "com-squareup-retrofit2-converter-moshi",
    "com-squareup-retrofit2-retrofit",
]
okhttp3 = [
    "com-squareup-okhttp3-logging-interceptor",
    "com-squareup-okhttp3-okhttp",
    "com-squareup-okhttp3-okhttp-urlconnection",
]
ui = [
    "com-hannesdorfmann-adapterdelegates4",
    "io-coil-kt-coil-compose",
]
navigation = [
    "androidx-hilt-navigation-compose",
    "androidx-navigation-ui-ktx",
]
compose = [
    "androidx-compose-material",
    "androidx-compose-ui-tooling",
]
room = [
    "androidx-room-ktx",
    "androidx-room-runtime",
]
testing = [
    "junit",
    "mockk",
]
testing-compose = [
    "androidx-compose-ui-test-junit4",
    "androidx-navigation-testing",
]

[plugins]
android-application = { id = "com.android.application", version.ref = "android-version" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin-version" }
jetbrains-kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin-version" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp-version" }
google-services = { id = "com.google.gms.google-services", version.ref = "google-services-version" }
firebase-crashlytics = { id = "com.google.firebase.crashlytics", version.ref = "firebase-crashlytics-version" }
dagger-hilt = { id = "com.google.dagger.hilt.android", version.ref = "dagger-hilt-version" }
gradle-versions = { id = "com.github.ben-manes.versions", version.ref = "gradle-versions-version" }
version-catalog-update = { id = "nl.littlerobots.version-catalog-update", version.ref = "version-catalog-update-version" }
ktfmt = { id = "com.ncorti.ktfmt.gradle", version.ref = "ktfmt-version" }
