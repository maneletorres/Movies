[versions]
# Plugin versions:
android-version = "8.11.1"
kotlin-version = "2.2.0"
ksp-version = "2.2.0-2.0.2"
google-services-version = "4.4.3"
firebase-crashlytics-version = "3.0.5"
dagger-hilt-version = "2.57"
gradle-versions-version = "0.52.0"
version-catalog-update-version = "1.0.0"
ktfmt-version = "0.23.0"
# Library versions:
androidx-bom-version = "2025.07.00"
firebase-bom-version = "34.0.0"
timber-version = "5.0.1"
retrofit2-bom-version = "3.0.0"
okhttp3-bom = "5.1.0"
coil-kt-version = "2.7.0"
adapter-delegates4-version = "4.3.2"
navigation-ui-ktx-version = "2.9.3"
mockk-version = "1.14.5"
moshi-version = "1.15.2"
hilt-version = "1.2.0"
room-version = "2.7.2"
# Testing library versions:
test-espresso-core-version = "3.5.1"
junit-version = "4.13.2"
junit-params-version = "1.1.1"
kotlinx-coroutines-test = "1.6.4"
hilt-testing-version = "2.45"
turbine-version = "0.12.1"
mockito-version = "4.1.0"
io-mockk-version = "1.13.4"

[libraries]
# Dependency injection (DI) libraries:
dagger-hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "dagger-hilt-version" }
dagger-hilt-android-compiler = { module = "com.google.dagger:hilt-android-compiler", version.ref = "dagger-hilt-version" }
# Firebase libraries:
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebase-bom-version" }
firebase-analytics = { module = "com.google.firebase:firebase-analytics" }
firebase-crashlytics = { module = "com.google.firebase:firebase-crashlytics" }
firebase-auth = { module = "com.google.firebase:firebase-auth" }
# Timber libraries:
com-jakewharton-timber = { module = "com.jakewharton.timber:timber", version.ref = "timber-version" }
# Retrofit libraries:
com-squareup-retrofit2-bom = { module = "com.squareup.retrofit2:retrofit-bom", version.ref = "retrofit2-bom-version" }
com-squareup-retrofit2-retrofit = { module = "com.squareup.retrofit2:retrofit" }
com-squareup-retrofit2-converter-moshi = { module = "com.squareup.retrofit2:converter-moshi" }
com-squareup-moshi-moshi-kotlin-codegen = { module = "com.squareup.moshi:moshi-kotlin-codegen", version.ref = "moshi-version" }
# OkHttp libraries:
com-squareup-okhttp3-bom = { module = "com.squareup.okhttp3:okhttp-bom", version.ref = "okhttp3-bom" }
com-squareup-okhttp3-okhttp = { module = "com.squareup.okhttp3:okhttp" }
com-squareup-okhttp3-okhttp-urlconnection = { module = "com.squareup.okhttp3:okhttp-urlconnection" }
com-squareup-okhttp3-logging-interceptor = { module = "com.squareup.okhttp3:logging-interceptor" }
com-squareup-okhttp3-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "okhttp3-version" }
# UI libraries:
io-coil-kt-coil-compose = { module = "io.coil-kt:coil-compose", version.ref = "coil-kt-version" }
com-hannesdorfmann-adapterdelegates4 = { module = "com.hannesdorfmann:adapterdelegates4", version.ref = "adapter-delegates4-version" }
# Navigation libraries:
androidx-hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "hilt-version" }
androidx-navigation-ui-ktx = { module = "androidx.navigation:navigation-ui-ktx", version.ref = "navigation-ui-ktx-version" }
# Jetpack Compose libraries:
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "androidx-bom-version" }
androidx-compose-material = { module = "androidx.compose.material:material" }
androidx-compose-material-icons-core = { module = "androidx.compose.material:material-icons-core" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest", version.ref = "compose-ui-version" }

# Room:
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room-version" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room-version" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room-version" }
# Testing libraries:
androidx-test-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "test-espresso-core-version" }
# Navigation testing libraries:
androidx-navigation-testing = { module = "androidx.navigation:navigation-testing", version.ref = "navigation-ui-ktx-version" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk-version" }

# JUnit testing libraries:
junit = { module = "junit:junit", version.ref = "junit-version" }
junit-params = { module = "pl.pragmatists:JUnitParams", version.ref = "junit-params-version" }

# Coroutines testing libraries:
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines-test" }
# Hilt testing libraries:
hilt-android-testing = { module = "com.google.dagger:hilt-android-testing", version.ref = "hilt-testing-version" }
hilt-android-compiler = { module = "com.google.dagger:hilt-android-compiler", version.ref = "hilt-testing-version" }

# ViewModel testing libraries:
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine-version" }

# Mock libraries:
mockito = { module = "org.mockito.kotlin:mockito-kotlin", version.ref = "mockito-version" }
io-mockk = { module = "io.mockk:mockk", version.ref = "io-mockk-version" }

[bundles]
firebase = [
    "firebase-analytics",
    "firebase-auth",
    "firebase-crashlytics",
]
retrofit2 = [
    "com-squareup-retrofit2-converter-moshi",
    "com-squareup-retrofit2-retrofit",
]
okhttp3 = [
    "com-squareup-okhttp3-logging-interceptor",
    "com-squareup-okhttp3-okhttp",
    "com-squareup-okhttp3-okhttp-urlconnection",
]
ui = [
    "com-hannesdorfmann-adapterdelegates4",
    "io-coil-kt-coil-compose",
]
navigation = [
    "androidx-hilt-navigation-compose",
    "androidx-navigation-ui-ktx",
]
compose = [
    "androidx-compose-material",
    "androidx-compose-material-icons-core",
    "androidx-compose-ui-tooling",
]
room = [
    "androidx-room-ktx",
    "androidx-room-runtime",
]
testing = [
    "junit",
    "mockk",
]
testing-compose = [
    "androidx-compose-ui-test-junit4",
    "androidx-navigation-testing",
]

# Testing bundles:
android-testing = [
    "androidx-test-espresso-core",
    "junit-params"
]
unit-testing = [
    "junit",
    "junit-params",
    "kotlinx-coroutines-test",
    "com-squareup-okhttp3-mockwebserver",
    "turbine",
    "mockito",
    "io-mockk"
]

[plugins]
android-application = { id = "com.android.application", version.ref = "android-version" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin-version" }
jetbrains-kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin-version" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp-version" }
google-services = { id = "com.google.gms.google-services", version.ref = "google-services-version" }
firebase-crashlytics = { id = "com.google.firebase.crashlytics", version.ref = "firebase-crashlytics-version" }
dagger-hilt = { id = "com.google.dagger.hilt.android", version.ref = "dagger-hilt-version" }
gradle-versions = { id = "com.github.ben-manes.versions", version.ref = "gradle-versions-version" }
version-catalog-update = { id = "nl.littlerobots.version-catalog-update", version.ref = "version-catalog-update-version" }
ktfmt = { id = "com.ncorti.ktfmt.gradle", version.ref = "ktfmt-version" }
