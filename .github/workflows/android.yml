name: Android CI

on:
  pull_request:
    branches: [ master, develop, epic/**, feature/** ]

jobs:
  compile-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup JDK 21
        uses: ./.github/actions/setup-java

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Load fake bearer token
        run: echo "BEARER_TOKEN=\"${{ secrets.BEARER_TOKEN }}\"" > ./local.properties

      - name: Create fake google-services.json
        id: create-json
        uses: jsdaniell/create-json@v1.2.2
        with:
          name: "google-services.json"
          json: '{
                "project_info": {
                  "project_number": "",
                  "project_id": ""
                },
                "client": [
                  {
                    "client_info": {
                      "mobilesdk_app_id": "${{ secrets.MOBILESDK_APP_ID }}",
                      "android_client_info": {
                        "package_name": "${{ secrets.PACKAGE_NAME }}"
                      }
                    },
                    "oauth_client": [
                      {
                        "client_id": "${{ secrets.CLIENT_ID }}",
                        "client_type": 3
                      }
                    ],
                    "api_key": [
                      {
                        "current_key": ""
                      }
                    ]
                  }
                ]
              }'
          dir: './app/'

      - name: Build with Gradle
        run: ./gradlew build

      - name: Run Unit Test
        run: ./gradlew testDebugUnitTest

      - name: Android Test report
        uses: asadmansr/android-test-report-action@v1.2.0
        if: ${{ always() }}