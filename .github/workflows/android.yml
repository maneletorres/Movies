name: Android CI

on:
  pull_request:
    branches: [ master, develop, epic/**, feature/** ]

jobs:
  compile-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup JDK 17
        uses: ./.github/actions/setup-java

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Load fake bearer token
        run: echo "BEARER_TOKEN=\"${{ secrets.BEARER_TOKEN }}\"" > ./local.properties

      - name: Create fake google-services.json
        id: create-json
        uses: jsdaniell/create-json@v1.2.2
        with:
          name: "./app/google-services.json"
          json: '{
                "project_info": {
                  "project_number": "",
                  "project_id": ""
                },
                "client": [
                  {
                    "client_info": {
                      "mobilesdk_app_id": "1:189647608548:android:c079c129db05d06c952af1",
                      "android_client_info": {
                        "package_name": "com.manishsputnikcorporation.movies"
                      }
                    },
                    "api_key": [
                      {
                        "current_key": ""
                      }
                    ]
                  }
                ]
              }'

      - name: Build with Gradle
        run: ./gradlew build

      - name: Run Unit Test
        run: ./gradlew testDebugUnitTest

      - name: Android Test report
        uses: asadmansr/android-test-report-action@v1.2.0
        if: ${{ always() }}