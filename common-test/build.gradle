plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

android {
    compileSdk 33
    defaultConfig {
        minSdk 21
        targetSdk 33
    }
    namespace 'com.manishsputnikcorporation.movies.common_test'
}

dependencies {
    implementation project(path: ':app')
    implementation libs.kotlinx.coroutines.test
}