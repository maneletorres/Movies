plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
    id 'dagger.hilt.android.plugin'
    id 'kotlin-parcelize'
    id 'androidx.navigation.safeargs.kotlin'
    id("com.ncorti.ktfmt.gradle") version "0.11.0"
}

android {
    def localProperties = new Properties()
    localProperties.load(new FileInputStream(rootProject.file("local.properties")))

    compileSdk 33

    defaultConfig {
        applicationId "com.manishsputnikcorporation.movies"
        minSdk 21
        targetSdk 33
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        debug {
            buildConfigField("String", "API_KEY", localProperties['apiKey'])
        }

        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        viewBinding true
        compose true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    composeOptions {
        kotlinCompilerExtensionVersion rootProject.composeCompilerVersion
    }
    namespace 'com.manishsputnikcorporation.movies'
}

dependencies {
    // region Dependency injection (DI) libraries:
    implementation libs.dagger.hilt.android
    kapt libs.dagger.hilt.android.compiler
    // endregion

    implementation libs.bundles.retrofit2
    implementation libs.bundles.okhttp3
    implementation libs.bundles.ui
    implementation libs.bundles.navigation
    implementation libs.bundles.compose

    // region Room:
    implementation libs.bundles.room
    kapt libs.androidx.room.compiler
    // endregion

    // region Testing libraries:
    testImplementation libs.junit
    androidTestImplementation libs.androidx.test.espresso.core

    // region Compose testing libraries:
    androidTestImplementation libs.androidx.compose.ui.test.junit4
    debugImplementation libs.androidx.compose.ui.test.manifest
    androidTestImplementation libs.androidx.navigation.testing
    // endregion
    // endregion
}