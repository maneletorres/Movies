plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
    id 'dagger.hilt.android.plugin'
    id 'kotlin-parcelize'
    id 'androidx.navigation.safeargs.kotlin'
}

android {
    def localProperties = new Properties()
    localProperties.load(new FileInputStream(rootProject.file("local.properties")))

    compileSdk 33

    defaultConfig {
        applicationId "com.maneletorres.simpletemplate"
        minSdk 21
        targetSdk 33
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        debug {
            buildConfigField("String", "API_KEY", localProperties['apiKey'])
            buildConfigField("String", "IMDB_API_KEY", localProperties['imdbApiKey'])
        }

        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        viewBinding true
        compose true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    composeOptions {
        kotlinCompilerExtensionVersion rootProject.composeCompilerVersion
    }
    namespace 'com.maneletorres.simpletemplate'
}

dependencies {
    // region Dependency injection (DI) libraries:
    implementation "com.google.dagger:hilt-android:$rootProject.daggerHiltVersion"
    kapt "com.google.dagger:hilt-android-compiler:$rootProject.daggerHiltVersion"
    // endregion

    // region Retrofit libraries:
    implementation "com.squareup.retrofit2:retrofit:$rootProject.retrofitVersion"
    implementation "com.squareup.retrofit2:converter-gson:$rootProject.retrofitVersion"
    // endregion

    // region OkHttp libraries:
    implementation "com.squareup.okhttp3:okhttp:$rootProject.okHttpVersion"
    implementation "com.squareup.okhttp3:okhttp-urlconnection:$rootProject.okHttpVersion"
    implementation "com.squareup.okhttp3:logging-interceptor:$rootProject.okHttpVersion"
    // endregion

    // region UI libraries:
    implementation "io.coil-kt:coil-compose:$rootProject.coilVersion"
    implementation "com.hannesdorfmann:adapterdelegates4:$rootProject.adapterDelegatesVersion"
    // endregion

    // region Navigation libraries:
    implementation "androidx.hilt:hilt-navigation-compose:$rootProject.hiltNavigationCompose"
    implementation "androidx.navigation:navigation-ui-ktx:$rootProject.navigationVersion"
    // endregion

    // region Jetpack Compose libraries:
    implementation "androidx.compose.material:material:$rootProject.composeVersion"
    implementation "androidx.compose.ui:ui-tooling:$rootProject.composeVersion"
    // endregion

    // region Util libraries:
    // TODO: implementation "com.ncorti.ktfmt.gradle:plugin:rootProject."
    // TODO: implementation "com.vanniktech:gradle-android-junit-jacoco-plugin:rootProject."
    // endregion

    // region Testing libraries:
    testImplementation "junit:junit:$rootProject.junitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$rootProject.espressoVersion"

    // region Compose testing libraries:
    androidTestImplementation "androidx.compose.ui:ui-test-junit4:$rootProject.composeVersion"
    debugImplementation "androidx.compose.ui:ui-test-manifest:$rootProject.composeVersion"
    androidTestImplementation "androidx.navigation:navigation-testing:$rootProject.navigationVersion"
    // endregion
    // endregion
}