plugins {
    alias libs.plugins.android.application
    alias libs.plugins.kotlin
    alias libs.plugins.ksp
    alias libs.plugins.dagger.hilt
    alias libs.plugins.google.services
    alias libs.plugins.firebase.crashlytics
    alias libs.plugins.ktfmt
    id 'kotlin-parcelize'
}

android {
    compileSdk 34

    defaultConfig {
        applicationId "com.manishsputnikcorporation.movies"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        def localProperties = new Properties()
        try {
            localProperties.load(new FileInputStream(rootProject.file("local.properties")))
            buildConfigField("String", "BEARER_TOKEN", localProperties['BEARER_TOKEN'])
        } catch (IOException exception) {
            println "Exception: $exception"
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        viewBinding true
        compose true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    composeOptions {
        kotlinCompilerExtensionVersion rootProject.composeCompilerVersion
    }
    namespace 'com.manishsputnikcorporation.movies'
}

dependencies {
    // region Dependency injection (DI) libraries:
    runtimeOnly libs.dagger.hilt.android
    ksp libs.dagger.hilt.android.compiler
    // endregion

    // region Firebase:
    implementation(platform(libs.firebase.bom))
    implementation libs.bundles.firebase
    // endregion

    implementation libs.com.jakewharton.timber
    implementation libs.bundles.retrofit2
    implementation libs.bundles.okhttp3
    implementation libs.bundles.ui
    implementation libs.bundles.navigation
    implementation libs.bundles.compose

    // region Room:
    implementation libs.bundles.room
    ksp libs.androidx.room.compiler
    // endregion

    // region Testing libraries:
    testImplementation libs.bundles.testing
    androidTestImplementation libs.bundles.testing.compose
    // endregion
}